<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="hsl(252 10% 16.5%)" />
        <meta
            name="description"
            content="Ajit Singh Kamal — frontend developer in Madrid, Spain."
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32.png"
        />
        <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Freeman&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
            rel="stylesheet"
        />
        <title>Ajit Singh Kamal — Developer</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="./script.js" defer></script>
    </head>
    <body>
        <main class="stage">
            <div class="card-stage" data-tilt-stage>
                <article
                    class="profile-card"
                    data-tilt-card
                    aria-label="Ajit Singh Kamal profile card"
                >
                    <header class="card-header card-content">
                        <div class="card-identity">
                            <p class="card-kicker">FULLSTACK</p>
                            <h1>Ajit Singh Kamal</h1>
                            <p class="profile-role">Developer at CrowdStrike</p>
                        </div>
                        <div class="card-level">
                            <span>YEARS</span>
                            <strong>09</strong>
                        </div>
                    </header>

                    <div class="portrait-frame">
                        <img
                            class="profile-photo"
                            src="./images/profile-pic.png"
                            alt="Cartoon portrait of Ajit Singh Kamal in the mountains"
                            draggable="false"
                            width="375"
                            height="380"
                        />
                    </div>

                    <section
                        class="profile-statement"
                        aria-labelledby="profile-statement-title"
                    >
                        <h2
                            class="profile-statement-heading"
                            id="profile-statement-title"
                        >
                            Craft &amp; Clarity
                        </h2>
                        <p class="profile-statement-description">
                            Turns complex ideas into clear web experiences.
                        </p>
                    </section>

                    <dl class="card-facts card-content">
                        <div>
                            <dt>Focus</dt>
                            <dd>AI</dd>
                        </div>
                        <div>
                            <dt>Weakness</dt>
                            <dd>Chai</dd>
                        </div>
                        <div>
                            <dt>Based</dt>
                            <dd>Madrid</dd>
                        </div>
                    </dl>

                    <p class="profile-intro card-content">
                        I like working with thoughtful teams on products that
                        matter.
                    </p>

                    <nav
                        class="profile-links card-content"
                        aria-label="Contact and work links"
                    >
                        <a href="mailto:ajitsinghkamal@gmail.com" tabindex="0"
                            >Email</a
                        >
                        <a
                            href="https://github.com/ajitsinghkamal"
                            tabindex="0"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            GitHub
                        </a>
                        <a
                            href="https://linkedin.com/in/ajitsinghkamal"
                            tabindex="0"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            LinkedIn
                        </a>
                        <a
                            href="https://codepen.io/ajitsinghkamal"
                            tabindex="0"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            CodePen
                        </a>
                    </nav>
                </article>
            </div>
        </main>
    </body>
</html>
