<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="hsl(252 10% 16.5%)" />
        <meta
            name="description"
            content="Ajit Singh Kamal — frontend developer in Madrid, Spain."
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./images/favicon-32.png"
        />
        <link rel="apple-touch-icon" href="./images/apple-touch-icon.png" />
        <title>Ajit Singh Kamal — Developer</title>
        <link rel="stylesheet" href="./styles.css" />
        <script src="./script.js" defer></script>
    </head>
    <body>
        <main class="stage">
            <div class="card-hover-area" data-holo-stage>
                <article class="profile-card" data-holo-card>
                    <header class="card-header">
                        <div class="card-identity">
                            <p class="card-kicker">FULLSTACK</p>
                            <h1>Ajit Singh Kamal</h1>
                            <p class="profile-role">Developer at CrowdStrike</p>
                        </div>
                        <div class="card-level">
                            <span>YEARS</span>
                            <strong>09</strong>
                        </div>
                    </header>

                    <div class="portrait-frame">
                        <img
                            class="profile-photo"
                            src="./images/profile-pic-cartoon.png"
                            alt="Cartoon portrait of Ajit Singh Kamal in the mountains"
                            draggable="false"
                            width="375"
                            height="380"
                        />
                        <span class="portrait-location">Madrid, Spain</span>
                        <section
                            class="card-attack"
                            aria-labelledby="attack-name"
                        >
                            <div class="attack-heading">
                                <div>
                                    <h2 id="attack-name">
                                        Craft &amp; Clarity
                                    </h2>
                                </div>
                            </div>
                            <p class="attack-description">
                                Turns complex ideas into clear web experiences.
                            </p>
                        </section>
                    </div>

                    <div class="profile-content">
                        <dl class="card-facts">
                            <div>
                                <dt>Weakness</dt>
                                <dd>Good Chai</dd>
                            </div>
                            <div>
                                <dt>Previously</dt>
                                <dd>Glovo Ads</dd>
                            </div>
                        </dl>

                        <p class="profile-intro">
                            I like working with thoughtful teams on products
                            that matter.
                        </p>

                        <nav
                            class="profile-links"
                            aria-label="Contact and work links"
                        >
                            <a href="mailto:ajitsinghkamal@gmail.com">
                                Email
                                <span aria-hidden="true"
                                    ><svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        class="size-6"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                                        />
                                    </svg>
                                </span>
                            </a>
                            <a
                                href="https://github.com/ajitsinghkamal"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                GitHub
                                <span aria-hidden="true"
                                    ><svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        class="size-6"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                                        />
                                    </svg>
                                </span>
                            </a>
                            <a
                                href="https://linkedin.com/in/ajitsinghkamal"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                LinkedIn
                                <span aria-hidden="true"
                                    ><svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        class="size-6"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"
                                        />
                                    </svg>
                                </span>
                            </a>
                            <a
                                href="https://codepen.io/ajitsinghkamal"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                CodePen
                                <span aria-hidden="true"
                                    ><svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        fill="none"
                                        viewBox="0 0 24 24"
                                        stroke-width="1.5"
                                        stroke="currentColor"
                                        class="size-6"
                                    >
                                        <path
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                            d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"

                                </span>

                    </div>
                    <div class="card-holo" aria-hidden="true">
                        <div class="holo-pattern">
                            <div class="refraction"></div>

                        </div>
                    </div>
                </article>
            </div>
